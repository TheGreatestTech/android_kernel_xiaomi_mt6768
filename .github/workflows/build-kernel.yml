name: Build Zyte Kernel

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'Select Build Variant'
        required: true
        default: 'ksu_nomount'
        type: choice
        options:
          - base
          - ksu
          - ksu_nomount

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Add Swap Space (Prevents OOM crashes)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex \
            git libelf-dev libssl-dev lz4 make python3 rsync unzip zip zstd \
            libncurses-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ---------------------------------------------------------
      # CACHE 1: Clang Toolchain
      # ---------------------------------------------------------
      - name: Cache Clang Toolchain
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/toolchain
          key: clang-r450784e-v1

      - name: Download Clang Toolchain
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          echo "Clang not found in cache, downloading..."
          mkdir -p ${{ github.workspace }}/toolchain
          cd ${{ github.workspace }}/toolchain
          curl -L -o clang.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2022/clang-r450784e.tar.gz
          tar -xzf clang.tar.gz
          rm clang.tar.gz

      - name: Set Toolchain Path
        run: |
          echo "CLANG_PATH=${{ github.workspace }}/toolchain/clang-r450784e/bin" >> $GITHUB_ENV

      # ---------------------------------------------------------
      # INTEGRATIONS (Conditional based on inputs)
      # ---------------------------------------------------------
      - name: Integrate backslashxx KernelSU
        if: inputs.build_variant == 'ksu' || inputs.build_variant == 'ksu_nomount'
        run: |
          echo "Integrating backslashxx's KernelSU..."
          curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/master/kernel/setup.sh" | bash -

      - name: Integrate NoMount
        if: inputs.build_variant == 'ksu_nomount'
        run: |
          echo "Integrating NoMount..."
          curl https://raw.githubusercontent.com/maxsteeel/nomount/refs/heads/dev/kernel/setup.sh | bash -s dev

      # ---------------------------------------------------------
      # CACHE 2: Ccache for Object Files
      # ---------------------------------------------------------
      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: zyte-kernel-mt6768-${{ inputs.build_variant }}
          max-size: 2G

      - name: Configure and Build Kernel
        run: |
          export PATH="$CLANG_PATH:$PATH"
          
          echo "Generating base config..."
          make ARCH=arm64 O=out vendor/mt6768_defconfig
          
          echo "Appending fragment (vendor/selene.config)..."
          cat vendor/selene.config >> out/.config
          
          # Conditionally append KSU and NoMount flags
          if [ "${{ inputs.build_variant }}" == "ksu" ] || [ "${{ inputs.build_variant }}" == "ksu_nomount" ]; then
            echo "Appending KSU flags..."
            echo "CONFIG_KSU=y" >> out/.config
            echo "CONFIG_KSU_HACK_ARM64_BRANCH_LINK=y" >> out/.config
          fi
          
          if [ "${{ inputs.build_variant }}" == "ksu_nomount" ]; then
            echo "Appending NoMount flag..."
            echo "CONFIG_NOMOUNT=y" >> out/.config
          fi
          
          echo "Resolving dependencies..."
          make ARCH=arm64 O=out olddefconfig
          
          echo "Compiling kernel with ccache..."
          make ARCH=arm64 O=out -j$(nproc) CC="ccache clang" CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel
          
          if [ -f "out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp out/arch/arm64/boot/Image.gz-dtb anykernel/
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz anykernel/
          else
            cp out/arch/arm64/boot/Image anykernel/
          fi
          
          cd anykernel
          zip -r9 ../Zyte-Kernel-${{ inputs.build_variant }}-AnyKernel3.zip *

      - name: Upload Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: Zyte-Kernel-${{ inputs.build_variant }}-AnyKernel3
          path: Zyte-Kernel-${{ inputs.build_variant }}-AnyKernel3.zip
          if-no-files-found: error
